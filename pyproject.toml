[project]
name = "cwic705"
version = "0.1.0"
description = "Console CW decoder/encoder for the Icom IC-705 over WiFi (Icom LAN protocol)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manuel Alcocer", email = "manuel@alcocer.net" }]
dependencies = [
    "mutagen>=1.47",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
    "textual>=1.0",
    "websockets>=13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
cwic705 = "cwic705.cli:main"
cwic705-replay = "cwic705.replay:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwic705"]

[tool.pytest.ini_options]
testpaths = ["tests"]
